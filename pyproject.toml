[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pqblocks-population-anneal"
version = "0.1.0"
description = "Population Annealing Monte Carlo heuristic solver for Ising models and QUBO combinatorial optimization. Quantum-inspired classical optimization, not cryptography."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.11"
authors = [{name = "The PQBlocks Authors"}]
keywords = ["population-annealing", "monte-carlo", "ising", "qubo", "quantum-inspired", "heuristic", "resampling", "free-energy"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = ["numba", "numpy", "numpy", "numba"]

[project.optional-dependencies]
test = ["pytest", "numpy", "numba", "scipy"]

[project.urls]
Homepage = "https://github.com/PQBlocks/population-annealing"
Documentation = "https://github.com/PQBlocks/population-annealing#readme"
Source = "https://github.com/PQBlocks/population-annealing"
Changelog = "https://github.com/PQBlocks/population-annealing/blob/main/CHANGELOG.md"
Issues = "https://github.com/PQBlocks/population-annealing/issues"
Security = "https://github.com/PQBlocks/population-annealing/security/policy"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
